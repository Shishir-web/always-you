<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Letter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>For you</h1>

    <p class="letter-line" onclick="this.classList.add('show')">
      On days you feel small —
    </p>
    <p class="letter-line" onclick="this.classList.add('show')">
      unsure, or hard to love —
    </p>
    <p class="letter-line" onclick="this.classList.add('show')">
      I want you to remember this:
    </p>
    <p class="letter-line" onclick="this.classList.add('show')">
      You are chosen. Always.
    </p>
  </div>
</body>
</html>
