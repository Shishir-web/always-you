</head>
<body>
  <div class="container">
    <h1>You are beautiful</h1>

    <p class="hint">Tap when you’re ready</p>

    <div id="revealText" class="hidden-text">
        I know you don’t see it right now.<br><br>
        But I love the way you exist —
        even on the days you pull away,
        even when you doubt yourself.<br><br>
        You don’t need to be softer or brighter.
        You’re already enough for me.
    </div>      

    <button onclick="reveal()">Tap here</button>

    <button class="comfort-btn" onclick="badDay()">Today is hard</button>
    <a href="comfort.html"><button class="comfort-btn">I still need comfort</button></a>
  </div>
